services:
  app:
    build: .
    image: slph-omnibus:dev
    container_name: slph
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - pb_data:/data
    environment:
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:-}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:-}
      PB_SUPERUSER_UPDATE: ${PB_SUPERUSER_UPDATE:-}
      PB_APP_URL: ${PB_APP_URL:-}
      PB_APP_NAME: ${PB_APP_NAME:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  pb_data:
