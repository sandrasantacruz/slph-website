name: cloudflare

# Jeder Push deployt: main als Production, alle anderen Branches als
# Cloudflare-Preview unter <branch>.<projekt>.pages.dev. Ein zusaetzlicher
# pull_request-Trigger wuerde PR-Branches nur doppelt deployen.
on:
  push:
    branches: ['**']
  workflow_dispatch:

# Ein Deploy pro Branch zur Zeit; laufende Deploys eines aelteren Commits abbrechen.
concurrency:
  group: cloudflare-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CF_PROJECT_NAME: silospeceshablaran

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # CMS-URL und Tenant stehen in src/config.ts, nicht in
      # Repository-Variablen: keine Geheimnisse, und ein vergessener Wert
      # würde hier still eine leere Seite deployen.
      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ env.CF_PROJECT_NAME }}
            --branch=${{ github.ref_name }}
